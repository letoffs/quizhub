<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub — Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-link">
            <img src="images/logo.png" alt="QuizHub" class="logo-img">
        </a>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="profile.html" class="active">Профиль</a>
            <a href="#" id="authLink">Выйти</a>
        </nav>
    </header>

    <main class="container">
        <h1>Личный кабинет</h1>
        
        <div class="profile-grid">
            
            <!-- Левая колонка: Данные пользователя -->
            <div class="profile-card">
                <h2>Мои данные</h2>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label>Email (нельзя изменить)</label>
                        <input type="email" id="profileEmail" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label>Отображаемое имя</label>
                        <input type="text" id="profileName" required>
                    </div>

                    <div class="form-group">
                        <label>Роль в системе</label>
                        <input type="text" id="profileRole" disabled>
                    </div>

                    <button type="submit" class="btn btn-full">Сохранить изменения</button>
                </form>
            </div>

            <!-- Правая колонка: История тестов -->
            <div class="profile-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin-bottom: 0;">История прохождения</h2>
                    <!-- Кнопка сброса -->
                    <button id="resetProgressBtn" class="btn btn-delete-row" style="font-size: 14px; padding: 5px 10px; border: 1px solid #e74c3c;">
                        Сбросить прогресс
                    </button>
                </div>
                
                <div id="historyList" class="history-list">
                    <p class="loading">Загрузка истории...</p>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
