<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>QuizHub — Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Регистрация</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="name" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="user@mail.com">
                </div>
                <div class="form-group">
                    <label>Пароль (мин. 6 символов)</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-full">Зарегистрироваться</button>
                <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </form>
        </div>
    </div>
    <script type="module" src="js/register.js"></script>
</body>
</html>
