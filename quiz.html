<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>QuizHub — Прохождение теста</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-link">
            <img src="images/logo.png" alt="QuizHub" class="logo-img">
        </a>
        <div class="timer" id="timer">--:--</div>
    </header>

    <main class="container">
        <div id="quizContainer">
            <h1 id="quizTitle">Загрузка...</h1>
            <p id="questionCounter">Вопрос 1 из 1</p>
            
            <div class="question-box">
                <h2 id="questionText">...</h2>
                <div id="optionsList" class="options-list">
                    <!-- Сюда будут загружаться варианты ответов -->
                </div>
                <div id="textAnswerBlock" style="display: none; margin-top: 20px;">
                    <label for="textInput" style="font-weight: bold; display: block; margin-bottom: 10px;">Ваш ответ:</label>
                    <input type="text" id="textInput" class="form-control" style="width: 100%; padding: 15px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 8px;" placeholder="Введите ответ...">
                </div>
            </div>

            <button id="nextBtn" class="btn">Следующий вопрос</button>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 QuizHub. Курсовой проект.</p>
    </footer>

    <script type="module" src="js/quiz.js"></script>
</body>
</html>
